<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Événement Roblox</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #111216;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background-color: #1b1d22;
      border-radius: 10px;
      padding: 35px 25px 25px 25px;
      width: 90%;
      max-width: 340px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Le logo est dimensionné exactement comme sur l'image 2 */
    .logo {
      width: 170px;
      height: 40px;
      margin-bottom: 25px;
    }

    /* Police très grasse pour simuler parfaitement le logo */
    .roblox-text {
      font-family: 'Arial Black', 'Impact', sans-serif;
      font-size: 42px;
      font-weight: 900;
      fill: white;
    }

    /* Le trou du carré prend la couleur de la carte */
    .hole {
      fill: #1b1d22; 
    }

    .input-group {
      width: 100%;
      margin-bottom: 15px;
    }

    .input-field {
      width: 100%;
      background-color: #111216;
      border: 2px solid #00b06f; /* Bordure épaissie et vert plus vif */
      border-radius: 8px;
      padding: 14px 16px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    .input-field::placeholder {
      color: #72767d;
    }

    .btn-continue {
      width: 100%;
      background-color: #00b06f;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- SVG blindé : Lettres positionnées manuellement + Carré -->
    <svg class="logo" viewBox="0 0 210 50" xmlns="http://www.w3.org/2000/svg">
      <text x="0" y="42" class="roblox-text">R</text>
      
      <!-- L'icône Roblox au milieu -->
      <g transform="translate(36, 11) rotate(12)">
        <rect x="0" y="0" width="30" height="30" rx="3" fill="white" />
        <rect x="10" y="10" width="10" height="10" rx="1.5" class="hole" />
      </g>
      
      <!-- La suite du texte -->
      <text x="76" y="42" class="roblox-text">B</text>
      <text x="108" y="42" class="roblox-text">L</text>
      <text x="136" y="42" class="roblox-text">O</text>
      <text x="172" y="42" class="roblox-text">X</text>
    </svg>

    <div class="input-group">
      <input type="text" id="username" class="input-field" placeholder="Type your username ..." autocomplete="off">
    </div>

    <button type="button" class="btn-continue" id="submitBtn">Continue</button>
  </div>

</body>
</html>
