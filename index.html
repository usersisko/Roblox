<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Événement Roblox</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #111216;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background-color: #1b1d22;
      border: 1px solid #282a30;
      border-radius: 16px;
      padding: 32px 24px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 170px;
      height: auto;
      margin-bottom: 28px;
    }

    .input-group {
      width: 100%;
      margin-bottom: 16px;
    }

    .input-field {
      width: 100%;
      background-color: #111216;
      border: 1.5px solid #00a257;
      border-radius: 12px;
      padding: 14px 16px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    .input-field::placeholder {
      color: #72767d;
    }

    .btn-continue {
      width: 100%;
      background-color: #00a257;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- SVG complet : R-O-B-L-O-X + icône -->
    <svg class="logo" viewBox="0 0 500 100" fill="white" xmlns="http://www.w3.org/2000/svg">
      <!-- Logo carré incliné -->
      <path d="M 15 20 L 70 5 L 85 60 L 30 75 Z M 42 35 L 53 32 L 56 43 L 45 46 Z" />
      <!-- R -->
      <path d="M 100 20 H 125 C 135 20 142 26 142 35 C 142 42 137 47 130 49 L 144 75 H 128 L 116 52 H 114 V 75 H 100 V 20 Z M 114 41 H 124 C 128 41 130 39 130 36 C 130 33 128 31 124 31 H 114 V 41 Z" />
      <!-- O -->
      <path d="M 168 20 C 183 20 195 32 195 47.5 C 195 63 183 75 168 75 C 153 75 141 63 141 47.5 C 141 32 153 20 168 20 Z M 168 33 C 160 33 154 39 154 47.5 C 154 56 160 62 168 62 C 176 62 182 56 182 47.5 C 182 39 176 33 168 33 Z" />
      <!-- B -->
      <path d="M 203 20 H 225 C 234 20 240 25 240 32 C 240 37 237 41 232 43 C 238 45 242 50 242 57 C 242 66 235 75 224 75 H 203 V 20 Z M 217 41 H 223 C 226 41 228 39 228 36 C 228 33 226 31 223 31 H 217 V 41 Z M 217 64 H 224 C 227 64 229 62 229 58 C 229 54 227 52 224 52 H 217 V 64 Z" />
      <!-- L -->
      <path d="M 250 20 H 264 V 63 H 285 V 75 H 250 V 20 Z" />
      <!-- O -->
      <path d="M 312 20 C 327 20 339 32 339 47.5 C 339 63 327 75 312 75 C 297 75 285 63 285 47.5 C 285 32 297 20 312 20 Z M 312 33 C 304 33 298 39 298 47.5 C 298 56 304 62 312 62 C 320 62 326 56 326 47.5 C 326 39 320 33 312 33 Z" />
      <!-- X -->
      <path d="M 345 20 H 360 L 372 43 L 384 20 H 399 L 380 47.5 L 400 75 H 385 L 372 52 L 359 75 H 344 L 364 47.5 Z" />
    </svg>

    <div class="input-group">
      <input type="text" id="username" class="input-field" placeholder="Type your username ..." autocomplete="off">
    </div>

    <button type="button" class="btn-continue" id="submitBtn">Continue</button>
  </div>

</body>
</html>
