<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Événement Roblox</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #111216;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background-color: #1b1d22;
      border: 1px solid #282a30;
      border-radius: 16px;
      padding: 32px 24px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Ajustement de l'image du logo */
    .logo {
      height: 36px;
      width: auto;
      margin-bottom: 28px;
    }

    .input-group {
      width: 100%;
      margin-bottom: 16px;
    }

    .input-field {
      width: 100%;
      background-color: #111216;
      border: 1.5px solid #00a257;
      border-radius: 12px;
      padding: 14px 16px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    .input-field::placeholder {
      color: #72767d;
    }

    .btn-continue {
      width: 100%;
      background-color: #00a257;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Logo Roblox nettoyé -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_logo_2022.svg" alt="Roblox" class="logo">

    <div class="input-group">
      <input type="text" id="username" class="input-field" placeholder="Type your username ..." autocomplete="off">
    </div>

    <button type="button" class="btn-continue" id="submitBtn">Continue</button>
  </div>

</body>
</html>
