<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Événement Roblox</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #111216;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background-color: #1b1d22;
      border: 1px solid #2a2c33;
      border-radius: 12px;
      padding: 32px 24px;
      width: 90%;
      max-width: 350px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Ajustement précis de la taille du vrai logo */
    .logo {
      width: 155px;
      height: auto;
      margin-bottom: 28px;
      fill: #ffffff;
    }

    .input-group {
      width: 100%;
      margin-bottom: 14px;
    }

    .input-field {
      width: 100%;
      background-color: #111216;
      border: 1.5px solid #00a257; /* Bordure fine et précise comme sur ton modèle */
      border-radius: 6px; /* Coins légèrement moins arrondis */
      padding: 13px 16px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    .input-field::placeholder {
      color: #72767d;
    }
    
    .input-field:focus {
      border-color: #00c76a;
    }

    .btn-continue {
      width: 100%;
      background-color: #00a257;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 13px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Les vrais tracés vectoriels du logo Roblox (aucun risque d'erreur de police) -->
    <svg class="logo" viewBox="0 0 250 65" xmlns="http://www.w3.org/2000/svg">
       <!-- R -->
       <path d="M12.9,13.9H31.5c7.9,0,14,5.6,14,13.6c0,8-6.1,13.6-14,13.6H21v13.5H12.9V13.9z M21,34.1h9.3c3.4,0,5.9-2.3,5.9-6.6 c0-4.3-2.5-6.6-5.9-6.6H21V34.1z"/>
       <!-- Premier O (Le carré penché) -->
       <path d="M72.2,14.6l-20.9,5l5.5,22.8l20.9-5L72.2,14.6z M64,30.3l-5.2,1.2l-1.3-5.6l5.2-1.2L64,30.3z"/>
       <!-- B -->
       <path d="M89.7,13.9h18.5c7.9,0,13.9,5.2,13.9,12.7c0,5.1-2.9,9.2-7.2,11.2c5.1,1.7,8.6,6.3,8.6,12c0,7.9-6.3,13.4-14.7,13.4H89.7 V13.9z M97.8,32.3h9.8c3.2,0,5.7-2.1,5.7-5.8c0-3.7-2.5-5.8-5.7-5.8h-9.8V32.3z M97.8,56.2h10.6c3.6,0,6.2-2.3,6.2-6.2 c0-3.9-2.6-6.2-6.2-6.2H97.8V56.2z"/>
       <!-- L -->
       <path d="M136.2,13.9h8.1v33.8h17.9v7H136.2V13.9z"/>
       <!-- Deuxième O (Normal) -->
       <path d="M184.2,13.1c11.9,0,21.5,9.6,21.5,21.5c0,11.9-9.6,21.5-21.5,21.5c-11.9,0-21.5-9.6-21.5-21.5 C162.6,22.7,172.2,13.1,184.2,13.1z M184.2,49c7.4,0,13.4-6,13.4-13.4c0-7.4-6-13.4-13.4-13.4c-7.4,0-13.4,6-13.4,13.4 C170.8,43.1,176.8,49,184.2,49z"/>
       <!-- X -->
       <path d="M219.1,13.9h9.1l8.5,13.5l8.5-13.5h9l-13.2,19.9l13.9,20.8h-9.2l-9-14.2l-9.1,14.2h-8.9l13.6-20.8L219.1,13.9z"/>
    </svg>

    <div class="input-group">
      <input type="text" id="username" class="input-field" placeholder="Type your username ..." autocomplete="off">
    </div>

    <button type="button" class="btn-continue" id="submitBtn">Continue</button>
  </div>

</body>
</html>
