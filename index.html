<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Événement Roblox</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #111216;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background-color: #1b1d22;
      border-radius: 10px;
      padding: 35px 25px 25px;
      width: 90%;
      max-width: 340px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 190px;
      height: auto;
      margin-bottom: 25px;
      display: block;
    }

    .roblox-text {
      fill: white;
      font-family: Arial Black, Impact, sans-serif;
      font-size: 40px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .roblox-square {
      fill: white;
    }

    .roblox-hole {
      fill: #1b1d22;
    }

    .input-group {
      width: 100%;
      margin-bottom: 15px;
    }

    .input-field {
      width: 100%;
      height: 50px;
      background-color: #111216;
      border: 2px solid #00b06f;
      border-radius: 8px;
      padding: 0 16px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-field::placeholder {
      color: #72767d;
    }

    .input-field:focus {
      border-color: #00c77d;
      box-shadow: 0 0 0 2px rgba(0, 176, 111, 0.15);
    }

    .btn-continue {
      width: 100%;
      height: 50px;
      background-color: #00b06f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-continue:hover {
      background-color: #00c77d;
    }

    .btn-continue:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <div class="card">

    <svg
      class="logo"
      viewBox="0 0 230 55"
      xmlns="http://www.w3.org/2000/svg"
      aria-label="Roblox"
    >

      <text
        x="0"
        y="43"
        class="roblox-text"
      >R</text>

      <g transform="translate(45 9) rotate(12 17 17)">
        <rect
          class="roblox-square"
          x="0"
          y="0"
          width="34"
          height="34"
          rx="2"
        />

        <rect
          class="roblox-hole"
          x="11"
          y="11"
          width="12"
          height="12"
          rx="1"
        />
      </g>

      <text
        x="86"
        y="43"
        class="roblox-text"
      >B</text>

      <text
        x="121"
        y="43"
        class="roblox-text"
      >L</text>

      <text
        x="151"
        y="43"
        class="roblox-text"
      >O</text>

      <text
        x="188"
        y="43"
        class="roblox-text"
      >X</text>

    </svg>

    <div class="input-group">
      <input
        type="text"
        id="username"
        class="input-field"
        placeholder="Type your username ..."
        autocomplete="off"
      >
    </div>

    <button
      type="button"
      class="btn-continue"
      id="submitBtn"
    >
      Continue
    </button>

  </div>

</body>
</html>
